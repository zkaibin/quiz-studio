<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Quiz Studio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 42px 36px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }

        .icon {
            font-size: 68px;
            margin-bottom: 18px;
            display: block;
        }

        h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 12px;
        }

        p {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .reset-form {
            margin-top: 20px;
            text-align: left;
            display: none;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .input-field {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .input-field:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .btn {
            display: inline-block;
            width: 100%;
            margin-top: 10px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.35);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .secondary-link {
            display: inline-block;
            margin-top: 16px;
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
        }

        .status {
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.92rem;
            background: #f3f4f6;
            color: #374151;
            display: none;
        }

        .status.ok {
            background: #dcfce7;
            color: #166534;
            display: block;
        }

        .status.err {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }

        .status.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="card">
        <span id="statusIcon" class="icon">🔐</span>
        <h1 id="statusTitle">Checking your reset link…</h1>
        <p id="statusMessage">Please wait while we verify your password reset request.</p>

        <form id="resetForm" class="reset-form" novalidate>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input id="newPassword" type="password" class="input-field" placeholder="At least 6 characters" />
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input id="confirmPassword" type="password" class="input-field" placeholder="Repeat your new password" />
            </div>
            <button id="resetPasswordBtn" type="submit" class="btn">Update Password</button>
        </form>

        <div id="statusBox" class="status"></div>
        <a href="index.html" class="secondary-link">Return to Quiz Studio</a>
    </div>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
      import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';

      const firebaseConfig = {
        apiKey: "AIzaSyCJvrCxJ103emuCwBWEYNzfbWjdV8QcO4w",
        authDomain: "quiz-studio-12339.firebaseapp.com",
        projectId: "quiz-studio-12339",
        storageBucket: "quiz-studio-12339.firebasestorage.app",
        messagingSenderId: "575996539322",
        appId: "1:575996539322:web:d9a3baffda5c5867496d83"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      var oobCode = null;

      function $(id) { return document.getElementById(id); }

      function setStatus(message, kind) {
        var box = $('statusBox');
        if (!box) return;
        box.textContent = message;
        box.className = 'status';
        if (kind) { box.classList.add(kind); } else { box.classList.add('show'); }
      }

      async function initializeRecovery() {
        var params = new URLSearchParams(window.location.search);
        oobCode = params.get('oobCode');
        var mode = params.get('mode');

        if (!oobCode || mode !== 'resetPassword') {
          $('statusTitle').textContent = 'Invalid reset link';
          $('statusMessage').textContent = 'This link is not a valid password reset link.';
          setStatus('Please request a fresh password reset email.', 'err');
          return;
        }

        try {
          await verifyPasswordResetCode(auth, oobCode);
          $('statusIcon').textContent = '\uD83D\uDD11';
          $('statusTitle').textContent = 'Set a new password';
          $('statusMessage').textContent = 'Enter your new password below to finish resetting your account.';
          $('resetForm').style.display = 'block';
          setStatus('Your secure reset link is ready.', 'ok');
        } catch (err) {
          $('statusTitle').textContent = 'Reset link error';
          $('statusMessage').textContent = 'This reset link has expired or is invalid.';
          setStatus(err.message, 'err');
        }
      }

      async function handleResetPassword(event) {
        event.preventDefault();
        if (!oobCode) {
          setStatus('This reset session is not ready. Please request a new reset email.', 'err');
          return;
        }

        var newPassword = $('newPassword').value;
        var confirmPassword = $('confirmPassword').value;
        var btn = $('resetPasswordBtn');

        if (!newPassword || newPassword.length < 6) {
          setStatus('Password must be at least 6 characters.', 'err');
          return;
        }
        if (newPassword !== confirmPassword) {
          setStatus('Passwords do not match.', 'err');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Updating password\u2026';

        try {
          await confirmPasswordReset(auth, oobCode, newPassword);
          $('newPassword').value = '';
          $('confirmPassword').value = '';
          $('resetForm').style.display = 'none';
          $('statusIcon').textContent = '\u2705';
          $('statusTitle').textContent = 'Password updated';
          $('statusMessage').textContent = 'Your password has been reset successfully. You can now sign in with the new password.';
          setStatus('Password reset complete.', 'ok');
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Update Password';
          setStatus(err.message, 'err');
        }
      }

      document.addEventListener('DOMContentLoaded', function () {
        $('resetForm').addEventListener('submit', handleResetPassword);
        initializeRecovery();
      });
    </script>
</body>
</html>
