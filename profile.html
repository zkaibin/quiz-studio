<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Quiz Studio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2270%22>QS</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=21">
    <style>
        .profile-wrap {
            max-width: 640px;
            margin: 0 auto;
        }

        .profile-card {
            background: #fff;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 24px;
            border: 1px solid var(--line);
        }

        .profile-card h2 {
            font-family: var(--font-display);
            color: var(--ink);
            margin-bottom: 6px;
            font-size: 1.15rem;
            letter-spacing: -0.02em;
        }

        .profile-email-display {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #374151;
            font-size: 0.92rem;
        }

        .input-field {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        textarea.input-field {
            resize: vertical;
            min-height: 80px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-danger {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .status-msg {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #f3f4f6;
            font-size: 0.9rem;
            min-height: 38px;
        }

        .status-msg.ok {
            background: #dcfce7;
            color: #166534;
        }

        .status-msg.err {
            background: #fee2e2;
            color: #991b1b;
        }

        .label-hint {
            font-weight: 400;
            color: #6b7280;
        }

        .divider {
            border: none;
            border-top: 1px solid var(--line);
            margin: 0 0 20px;
        }

        .profile-photo-row {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .profile-photo-preview {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #e5e7eb;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .profile-photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .profile-photo-fallback {
            font-size: 2rem;
        }

        .photo-actions {
            flex: 1;
            min-width: 240px;
        }

        .photo-help {
            margin-top: 8px;
            color: #6b7280;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .appearance-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <header class="header">
            <p class="header-kicker">Account</p>
            <h1>My Profile</h1>
            <p>Manage your account details and password</p>
        </header>

        <main>
            <div class="profile-wrap">

                <!-- Profile Info Card -->
                <div class="profile-card">
                    <h2>Profile Information</h2>
                    <p class="profile-email-display">Signed in as: <strong id="profileEmail"></strong></p>
                    <hr class="divider">

                    <form id="profileForm" novalidate>
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input id="fullName" type="text" class="input-field" placeholder="e.g. Tan Wei Ming" />
                        </div>

                        <div class="form-group">
                            <label for="displayName">Display Name <span class="label-hint">(shown on quizzes)</span></label>
                            <input id="displayName" type="text" class="input-field" placeholder="e.g. Wei Ming" />
                        </div>

                        <div class="form-group">
                            <label for="schoolLevel">School Level <span class="label-hint">(used to match daily challenge questions to your grade)</span></label>
                            <select id="schoolLevel" class="input-field">
                                <option value="">Select your level</option>
                                <option value="P1-P2">P1 – P2</option>
                                <option value="P3-P4">P3 – P4</option>
                                <option value="P5-P6">P5 – P6</option>
                                <option value="PSLE">PSLE</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="favouriteSubject">Favourite Subject</label>
                            <select id="favouriteSubject" class="input-field">
                                <option value="">Select one</option>
                                <option value="Math">Math</option>
                                <option value="Science">Science</option>
                                <option value="English">English</option>
                                <option value="Chinese">Chinese</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="avatarFile">Profile Picture <span class="label-hint">(upload an image or paste a link)</span></label>
                            <div class="profile-photo-row">
                                <div class="profile-photo-preview">
                                    <img id="avatarPreviewImg" alt="Profile picture preview" />
                                    <span id="avatarFallback" class="profile-photo-fallback">👤</span>
                                </div>
                                <div class="photo-actions">
                                    <input id="avatarFile" type="file" class="input-field" accept="image/*" />
                                    <div class="btn-row" style="margin-top: 10px;">
                                        <button type="button" id="removeAvatarBtn" class="btn btn-secondary">Remove Picture</button>
                                    </div>
                                    <div class="photo-help">PNG, JPG, GIF or WEBP up to 2 MB. Your image will be uploaded when you save your profile.</div>
                                </div>
                            </div>
                            <input id="avatarUrl" type="url" class="input-field" placeholder="Or paste an image URL" style="margin-top: 12px;" />
                        </div>

                        <div class="form-group">
                            <label for="bio">About Me <span class="label-hint">(optional)</span></label>
                            <textarea id="bio" class="input-field" placeholder="A short description about yourself…"></textarea>
                        </div>

                        <div class="btn-row">
                            <button type="submit" class="btn btn-primary">Save Profile</button>
                        </div>
                        <div id="profileStatus" class="status-msg"></div>
                    </form>
                </div>

                <div class="profile-card">
                    <h2>Appearance</h2>
                    <p class="profile-email-display">Choose your favourite colours and background for quiz pages.</p>
                    <hr class="divider">
                    <div class="appearance-grid">
                        <div class="form-group">
                            <label for="appearanceTheme">Colour Theme</label>
                            <select id="appearanceTheme" class="input-field">
                                <option value="default">Default Purple</option>
                                <option value="ocean">Ocean Blue</option>
                                <option value="sunset">Sunset Glow</option>
                                <option value="forest">Forest Green</option>
                                <option value="midnight">Midnight</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="backgroundStyle">Background</label>
                            <select id="backgroundStyle" class="input-field">
                                <option value="default">Classic Gradient</option>
                                <option value="sunrise">Sunrise</option>
                                <option value="aurora">Aurora</option>
                                <option value="meadow">Meadow</option>
                                <option value="night">Night Sky</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Change Password Card -->
                <div class="profile-card">
                    <h2>Change Password</h2>
                    <hr class="divider">

                    <form id="passwordForm" novalidate>
                        <div class="form-group">
                            <label for="newPassword">New Password</label>
                            <input id="newPassword" type="password" class="input-field" placeholder="At least 6 characters" />
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">Confirm New Password</label>
                            <input id="confirmPassword" type="password" class="input-field" placeholder="Repeat new password" />
                        </div>

                        <div class="btn-row">
                            <button type="submit" class="btn btn-primary">Change Password</button>
                        </div>
                        <div id="passwordStatus" class="status-msg"></div>
                    </form>
                </div>

                <!-- Sign Out -->
                <div class="profile-card">
                    <h2>Account</h2>
                    <hr class="divider">
                    <div class="btn-row">
                        <button onclick="window.location.href='dashboard.html'" class="btn btn-secondary">🏆 My Dashboard</button>
                        <button onclick="window.location.href='leaderboard.html'" class="btn btn-secondary">🏅 Leaderboard</button>
                        <button onclick="window.location.href='quiz-records.html'" class="btn btn-secondary">📋 My Quiz Records</button>
                        <button id="signOutBtn" class="btn btn-danger">Sign Out</button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    
    <script src="js/quiz-personalization.js?v=20"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script src="js/nav-auth.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/site-shell.js?v=20"></script>
</body>
</html>
