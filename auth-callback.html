<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Confirmed - Quiz Studio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .icon {
            font-size: 72px;
            margin-bottom: 20px;
            display: block;
        }

        .card h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 12px;
        }

        .card p {
            color: #6b7280;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .countdown {
            font-size: 0.9rem;
            color: #9ca3af;
            margin-top: 16px;
        }

        .btn {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .error-icon { font-size: 72px; margin-bottom: 20px; display: block; }
    </style>
</head>
<body>
    <div class="card">
        <span id="statusIcon" class="icon">⏳</span>
        <h1 id="statusTitle">Confirming your email…</h1>
        <p id="statusMessage">Please wait while we verify your account.</p>
        <p id="countdown" class="countdown"></p>
        <a id="homeBtn" href="index.html" class="btn" style="display:none;">Go to Quiz Studio</a>
    </div>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
      import { getAuth, applyActionCode, checkActionCode } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';

      const firebaseConfig = {
        apiKey: "AIzaSyCJvrCxJ103emuCwBWEYNzfbWjdV8QcO4w",
        authDomain: "quiz-studio-12339.firebaseapp.com",
        projectId: "quiz-studio-12339",
        storageBucket: "quiz-studio-12339.firebasestorage.app",
        messagingSenderId: "575996539322",
        appId: "1:575996539322:web:d9a3baffda5c5867496d83"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const icon      = document.getElementById('statusIcon');
      const title     = document.getElementById('statusTitle');
      const message   = document.getElementById('statusMessage');
      const countdown = document.getElementById('countdown');
      const homeBtn   = document.getElementById('homeBtn');

      function showError(msg) {
        icon.textContent = '\u274C';
        title.textContent = 'Confirmation Error';
        message.textContent = msg;
        homeBtn.style.display = 'inline-block';
      }

      function startRedirect() {
        let seconds = 5;
        countdown.textContent = 'Redirecting to Quiz Studio in ' + seconds + ' seconds\u2026';
        const interval = setInterval(function () {
          seconds--;
          if (seconds <= 0) {
            clearInterval(interval);
            window.location.href = 'index.html';
          } else {
            countdown.textContent = 'Redirecting to Quiz Studio in ' + seconds + ' seconds\u2026';
          }
        }, 1000);
      }

      async function handleCallback() {
        const params = new URLSearchParams(window.location.search);
        const oobCode = params.get('oobCode');
        const mode    = params.get('mode');

        if (!oobCode) {
          // Firebase email links are handled directly by Firebase — just redirect
          icon.textContent = '\u2705';
          title.textContent = 'All done!';
          message.textContent = 'Your email action was processed. Redirecting\u2026';
          homeBtn.style.display = 'inline-block';
          startRedirect();
          return;
        }

        if (mode === 'verifyEmail') {
          try {
            await applyActionCode(auth, oobCode);
            icon.textContent = '\u2705';
            title.textContent = 'Email Confirmed!';
            message.textContent = 'Your account has been successfully verified. You can now sign in to Quiz Studio.';
            homeBtn.style.display = 'inline-block';
            startRedirect();
          } catch (err) {
            showError('Confirmation failed: ' + err.message + '. Please request a fresh confirmation email.');
          }
        } else if (mode === 'resetPassword') {
          // Redirect to reset-password page with the code
          window.location.href = 'reset-password.html' + window.location.search;
        } else {
          showError('Unknown action. Please return to Quiz Studio.');
          homeBtn.style.display = 'inline-block';
        }
      }

      handleCallback();
    </script>
</body>
</html>
