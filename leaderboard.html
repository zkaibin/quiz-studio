<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Quiz Studio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2270%22>QS</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=21">
    <style>
        .lb-wrap {
            max-width: 720px;
            margin: 0 auto;
        }

        .lb-msg {
            padding: 14px;
            border-radius: 8px;
            background: var(--mist);
            color: var(--ink-soft);
            font-size: 0.93rem;
            margin-bottom: 16px;
        }

        .lb-msg.lb-msg-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .lb-table-scroll {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .lb-table {
            width: 100%;
            min-width: 520px;
            border-collapse: collapse;
            font-size: 0.93rem;
        }

        .lb-table th {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 2px solid var(--line);
            color: #6b7280;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .lb-table td {
            padding: 10px 10px;
            border-bottom: 1px solid #eef5f2;
            vertical-align: middle;
        }

        .lb-table tr:last-child td { border-bottom: none; }

        .lb-row-me {
            background: #eef8f5;
        }

        .lb-row-me td { font-weight: 600; }

        .lb-rank {
            font-size: 1.2rem;
            min-width: 48px;
            text-align: center;
        }

        .lb-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--mist);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--line);
        }

        .lb-avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .lb-avatar-fallback {
            font-size: 1.3rem;
        }

        .lb-name {
            color: var(--ink);
        }

        .lb-pts {
            font-weight: 700;
            color: #b45309;
        }

        .lb-quizzes {
            color: #6b7280;
        }

        .lb-empty {
            text-align: center;
            color: #9ca3af;
            padding: 30px;
        }

        .lb-note {
            margin-top: 16px;
            font-size: 0.82rem;
            color: #9ca3af;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 860px;">
        <header class="header">
            <p class="header-kicker">Rankings</p>
            <h1>Leaderboard</h1>
            <p>Top 50 learners by total reward points</p>
        </header>

        <main>
            <div class="lb-wrap">
                <div class="page-panel">
                    <div class="page-panel-toolbar">
                        <h2>🏆 Top Rankings</h2>
                        <button id="refreshBtn" class="btn-quiet" type="button">🔄 Refresh</button>
                    </div>

                    <div id="lbMsg" class="lb-msg" style="display:none"></div>

                    <div class="lb-table-scroll">
                        <table class="lb-table">
                            <thead>
                                <tr>
                                    <th>Rank</th>
                                    <th>Avatar</th>
                                    <th>Name</th>
                                    <th>Points</th>
                                    <th>Quizzes</th>
                                </tr>
                            </thead>
                            <tbody id="lbTbody">
                                <tr><td colspan="5" style="padding:20px; color:#9ca3af;">Loading…</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <p class="lb-note">Rankings update after each quiz. Only users who have completed at least one quiz appear here.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/quiz-personalization.js?v=20"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script src="js/nav-auth.js"></script>
    <script src="js/leaderboard.js"></script>
    <script src="js/site-shell.js?v=20"></script>
</body>
</html>
