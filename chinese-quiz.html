<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Quiz - Quiz Studio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2270%22>QS</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GWRDBHFHSQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-GWRDBHFHSQ');
    </script>
    <link rel="stylesheet" href="css/style.css?v=21">
</head>
<body class="quiz-page">
    <div class="container">
        <header class="header">
            <p class="header-kicker">华文 Chinese</p>
            <h1>华文练习，步步清晰</h1>
            <p>词汇、语法与成语练习，作答后立刻看到解析。</p>
        </header>

        <main>
            <section id="setupSection" class="section">
                <h2>Configure your Chinese quiz 设置测验</h2>
                <div class="form-group">
                    <label for="studentName">Your name</label>
                    <input type="text" id="studentName" placeholder="Enter your name" class="input-field" autocomplete="name">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="theme">Character theme</label>
                        <select id="theme" class="input-field"><option value="all">All themes</option></select>
                    </div>
                    <div class="form-group">
                        <label for="category">Topic 题目类型</label>
                        <select id="category" class="input-field"><option value="all">All</option></select>
                    </div>
                    <div class="form-group">
                        <label for="difficulty">Level</label>
                        <select id="difficulty" class="input-field"><option value="all">All levels</option></select>
                    </div>
                    <div class="form-group">
                        <label for="questionCount">Questions</label>
                        <select id="questionCount" class="input-field">
                            <option value="5">5 questions</option>
                            <option value="10" selected>10 questions</option>
                            <option value="15">15 questions</option>
                        </select>
                    </div>
                </div>
                <label class="mode-toggle">
                    <input type="checkbox" id="paperModeToggle">
                    <span>Paper mode (all questions on one page)</span>
                </label>
                <button id="startQuizBtn" class="btn btn-primary">Start Chinese quiz 开始测验</button>
            </section>

            <section id="quizSection" class="section hidden">
                <div class="quiz-header">
                    <div class="quiz-info">
                        <div class="quiz-title" id="quizTitle">Chinese Quiz</div>
                        <div class="quiz-meta">
                            <span id="studentNameDisplay"></span>
                            <span id="quizCategoryDisplay"></span>
                            <span id="quizDifficultyDisplay"></span>
                            <span id="quizThemeDisplay"></span>
                        </div>
                        <div class="quiz-instructions">Choose A–D or click an option. Press Enter to check, then continue.</div>
                    </div>
                    <div class="progress-wrap">
                        <div class="progress-bar" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
                        <div id="progressText">0 of 0 answered</div>
                    </div>
                </div>
                <div id="questionContainer" class="quiz-paper"></div>
                <div class="quiz-controls sticky-controls">
                    <button id="prevQuestionBtn" class="btn btn-secondary" type="button">Previous</button>
                    <button id="checkAnswerBtn" class="btn btn-secondary" type="button">Check answer</button>
                    <button id="nextQuestionBtn" class="btn btn-secondary" type="button">Next</button>
                    <button id="printBtn" class="btn btn-secondary" type="button">Print</button>
                    <button id="submitBtn" class="btn btn-primary" type="button">Submit quiz</button>
                </div>
            </section>

            <section id="resultsSection" class="section hidden">
                <h2>Quiz complete</h2>
                <div class="results-card">
                    <div class="score-display">
                        <div class="score-circle"><span id="finalScore">0</span>/<span id="totalQuestions">0</span></div>
                        <p id="scorePercentage">0%</p>
                    </div>
                    <p id="resultMessage" class="result-message"></p>
                    <p id="pointsEarned" class="points-earned" style="display:none"></p>
                    <div id="weakTopicsSummary" class="weak-topics"></div>
                </div>
                <div class="results-actions">
                    <button id="reviewBtn" class="btn btn-primary">Review answers</button>
                    <button id="retakeQuizBtn" class="btn btn-secondary">Take another quiz</button>
                </div>
            </section>

            <section id="reviewSection" class="section hidden">
                <h2>Answer review</h2>
                <div id="reviewContainer" class="review-container"></div>
                <button id="backToResultsBtn" class="btn btn-secondary">Back to results</button>
            </section>
        </main>
    </div>

    <script src="js/quiz-personalization.js?v=20"></script>
    <script src="js/rewards.js?v=20"></script>
    <script src="js/quiz-engine.js?v=20"></script>
    <script src="js/subject-quiz-bootstrap.js?v=20"></script>
    <script src="js/chinese-quiz.js?v=20"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script src="js/user-auth.js"></script>
    <script src="js/nav-auth.js"></script>
    <script src="js/site-shell.js?v=20"></script>
</body>
</html>
